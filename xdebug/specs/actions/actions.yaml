{
  "version": "xdebug.action_specs.v1",
  "actions": [
    {
      "name": "actions",
      "category": "builtin",
      "status": "stable",
      "requires": "none",
      "handler_kind": "actions",
      "schemas": {
        "request": "schemas/v1/actions/actions.request.schema.json",
        "response": "schemas/v1/actions/actions.response.schema.json"
      },
      "examples": {
        "request": [
          "examples/requests/actions.basic.json"
        ],
        "response": [
          "examples/responses/actions.basic.json"
        ]
      },
      "description_en": "List the public xdebug action catalog.",
      "description_zh": "列出当前运行时公开 action catalog。",
      "purposes": [
        "discover"
      ],
      "use_when": [
        "需要发现当前 runtime 公开的 action、状态和适用资源。"
      ],
      "do_not_use_when": [
        "已经知道 action 且需要它的字段、枚举或 response 合同。"
      ],
      "alternatives": [
        {
          "action": "schema",
          "when": "需要一个已知 action 的完整调用合同。"
        }
      ]
    },
    {
      "name": "apb.config.list",
      "category": "waveform",
      "status": "stable",
      "requires": "waveform",
      "handler_kind": "engine_forward",
      "schemas": {
        "request": "schemas/v1/actions/apb.config.list.request.schema.json",
        "response": "schemas/v1/actions/apb.config.list.response.schema.json"
      },
      "examples": {
        "request": [
          "examples/requests/apb.config.list.basic.json"
        ],
        "response": [
          "examples/responses/apb.config.list.basic.json"
        ]
      },
      "description_en": "List saved APB interface configurations.",
      "description_zh": "列出 APB 配置。",
      "purposes": [
        "discover"
      ],
      "use_when": [
        "Need to discover saved APB interface names before selecting one, without decoding transfers."
      ],
      "do_not_use_when": [
        "Do not use it to register a configuration or inspect APB transfers."
      ],
      "alternatives": [
        {
          "action": "apb.config.load",
          "when": "Register or replace an APB interface configuration."
        },
        {
          "action": "apb.query",
          "when": "Inspect decoded APB transfers."
        }
      ]
    },
    {
      "name": "apb.config.load",
      "category": "waveform",
      "status": "stable",
      "requires": "waveform",
      "handler_kind": "engine_forward",
      "schemas": {
        "request": "schemas/v1/actions/apb.config.load.request.schema.json",
        "response": "schemas/v1/actions/apb.config.load.response.schema.json"
      },
      "examples": {
        "request": [
          "examples/requests/apb.config.load.basic.json"
        ],
        "response": [
          "examples/responses/apb.config.load.basic.json"
        ]
      },
      "required_args": [
        "name"
      ],
      "required_arg_groups": [
        [
          "config"
        ],
        [
          "config_path"
        ]
      ],
      "description_en": "Load and validate an APB interface configuration.",
      "description_zh": "加载 APB 配置。",
      "purposes": [
        "configure"
      ],
      "use_when": [
        "Have an inline APB signal mapping or config file that must be registered and validated before querying transfers."
      ],
      "do_not_use_when": [
        "Do not use it to enumerate saved names or query decoded APB activity."
      ],
      "alternatives": [
        {
          "action": "apb.config.list",
          "when": "Discover saved APB configuration names."
        },
        {
          "action": "apb.query",
          "when": "Inspect transfers from a loaded interface."
        }
      ],
      "recommended_actions": [
        "value.at",
        "apb.query",
        "apb.transaction.cursor",
        "apb.statistics",
        "apb.transfer_window"
      ]
    },
    {
      "name": "apb.transaction.cursor",
      "category": "waveform",
      "status": "stable",
      "requires": "waveform",
      "handler_kind": "engine_forward",
      "schemas": {
        "request": "schemas/v1/actions/apb.transaction.cursor.request.schema.json",
        "response": "schemas/v1/actions/apb.transaction.cursor.response.schema.json"
      },
      "examples": {
        "request": [
          "examples/requests/apb.transaction.cursor.basic.json"
        ],
        "response": [
          "examples/responses/apb.transaction.cursor.basic.json"
        ]
      },
      "required_args": [
        "name",
        "op"
      ],
      "description_en": "Move a cursor across APB transfers.",
      "description_zh": "在 APB transfer 间移动游标。",
      "purposes": [
        "query"
      ],
      "use_when": [
        "Need stateful begin/next/prev navigation through decoded APB transfers one item at a time."
      ],
      "do_not_use_when": [
        "Do not use it for arbitrary waveform time bookmarks or bulk APB filtering."
      ],
      "alternatives": [
        {
          "action": "waveform.cursor.set",
          "when": "Store an arbitrary waveform time bookmark."
        },
        {
          "action": "apb.query",
          "when": "Filter or enumerate APB transfers."
        }
      ]
    },
    {
      "name": "apb.query",
      "category": "waveform",
      "status": "stable",
      "requires": "waveform",
      "handler_kind": "engine_forward",
      "schemas": {
        "request": "schemas/v1/actions/apb.query.request.schema.json",
        "response": "schemas/v1/actions/apb.query.response.schema.json"
      },
      "examples": {
        "request": [
          "examples/requests/apb.query.basic.json"
        ],
        "response": [
          "examples/responses/apb.query.basic.json"
        ]
      },
      "required_args": [
        "name"
      ],
      "description_en": "Query APB read and write transfers.",
      "description_zh": "查询 APB transfer。",
      "purposes": [
        "query"
      ],
      "use_when": [
        "Need completed APB transfer counts or rows filtered by direction and a canonical exact/range/mask address object."
      ],
      "do_not_use_when": [
        "Do not use it for AXI channel semantics, custom valid-ready fields, or a focused signal window around one APB transfer."
      ],
      "alternatives": [
        {
          "action": "apb.statistics",
          "when": "Need aggregate APB counts and unresolved-filter diagnostics without transaction rows."
        },
        {
          "action": "apb.transfer_window",
          "when": "Inspect signal evidence around one APB transfer."
        }
      ]
    },
    {
      "name": "apb.transfer_window",
      "category": "waveform",
      "status": "experimental",
      "requires": "waveform",
      "handler_kind": "engine_forward",
      "schemas": {
        "request": "schemas/v1/actions/apb.transfer_window.request.schema.json",
        "response": "schemas/v1/actions/apb.transfer_window.response.schema.json"
      },
      "examples": {
        "request": [
          "examples/requests/apb.transfer_window.basic.json"
        ],
        "response": [
          "examples/responses/apb.transfer_window.basic.json"
        ]
      },
      "required_args": [
        "name"
      ],
      "description_en": "Inspect the waveform window around an APB transfer.",
      "description_zh": "实验性 APB 窗口分析。",
      "purposes": [
        "analyze"
      ],
      "use_when": [
        "Have one APB transfer index and need the surrounding raw-signal timing evidence."
      ],
      "do_not_use_when": [
        "Do not use it to enumerate many APB transfers or return aggregate protocol counts."
      ],
      "alternatives": [
        {
          "action": "apb.query",
          "when": "Select APB transfers by direction, address, or index."
        },
        {
          "action": "apb.statistics",
          "when": "Return aggregate APB counts."
        }
      ]
    },
    {
      "name": "apb.statistics",
      "category": "waveform",
      "status": "stable",
      "requires": "waveform",
      "handler_kind": "engine_forward",
      "schemas": {
        "request": "schemas/v1/actions/apb.statistics.request.schema.json",
        "response": "schemas/v1/actions/apb.statistics.response.schema.json"
