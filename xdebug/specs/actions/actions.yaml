        ],
        "response": [
          "examples/responses/apb.statistics.basic.json"
        ]
      },
      "required_args": [
        "name"
      ],
      "required_target": [
        "session_id"
      ],
      "description_en": "Count completed APB transactions with optional direction and address filters.",
      "description_zh": "按方向和地址过滤统计已完成 APB 事务。",
      "purposes": [
        "analyze"
      ],
      "use_when": [
        "Count completed APB read and write transactions after applying protocol filters."
      ],
      "do_not_use_when": [
        "Inspecting individual APB transaction payloads or pending transfers."
      ],
      "alternatives": []
    },
    {
      "name": "axi.analysis",
      "category": "waveform",
      "status": "stable",
      "requires": "waveform",
      "handler_kind": "engine_forward",
      "schemas": {
        "request": "schemas/v1/actions/axi.analysis.request.schema.json",
        "response": "schemas/v1/actions/axi.analysis.response.schema.json"
      },
      "examples": {
        "request": [
          "examples/requests/axi.analysis.basic.json"
        ],
        "response": [
          "examples/responses/axi.analysis.basic.json"
        ]
      },
      "required_args": [
        "name"
      ],
      "description_en": "Analyze AXI latency, pending transactions, and outstanding activity.",
      "description_zh": "汇总 AXI 行为。",
      "purposes": [
        "analyze"
      ],
      "use_when": [
        "Need a derived latency, pending, or outstanding analysis across reconstructed AXI transactions rather than raw rows."
      ],
      "do_not_use_when": [
        "Do not use it for a raw transaction listing, a single outlier ranking, or aggregate filtered counts."
      ],
      "alternatives": [
        {
          "action": "axi.query",
          "when": "Inspect selected AXI channels or reconstructed transactions."
        },
        {
          "action": "axi.latency_outlier",
          "when": "Rank or threshold abnormal-latency transactions."
        },
        {
          "action": "axi.statistics",
          "when": "Count completed AXI transactions after filters."
        }
      ]
    },
