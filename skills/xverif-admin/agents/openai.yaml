interface:
  display_name: xverif-admin
  short_description: 管理 xverif MCP、session、transport、LSF 和 timeout
  default_prompt: >
    仅处理 xverif 运行环境和托管生命周期；普通事实查询使用 xverif，
    已注入 MCP 时使用 MCP，无 MCP 且必须 LSF 时使用
    xdebug_lsf/xcov_lsf，无 LSF 限制时使用原生工具；不自动 retry、
    reopen 或切换 backend/transport。入口同目录环境配置和远端环境指纹仅用于
    SDK-free LSF，不改变 MCP 行为。
