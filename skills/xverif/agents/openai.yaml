interface:
  display_name: "xverif"
  short_description: "按验证任务选择 xdebug、xcov、xbit、xentry、xloc、xsva 或 xwaveform"
  default_prompt: "使用 $xverif 先按问题类型选择能力，再按当前环境选择 MCP 或 CLI。xdebug 任务先调用一次 xverif_tools 并完整读取所有 action 的名称、状态与作用，再查询选定 action 的 schema。对关键信号或接口生成 schema-valid JSON，通过 list.load、stream.config.load、axi.config.load 或 apb.config.load 加载后查看；加载成功后优先按 recommended_actions 使用 value.at，通过 signal/list/apb/stream/axi 之一和 time/times 批量查询，不反复调用 batch，也不自动 fallback。xcov 与 x-npi 的 coverage 读取都使用 full64 URG，NPI 只做 exclusion 必要遍历和 EL 操作。xcov 必须先查询摘要，再导出 code/assert/functional 具体 gap；排除使用 export gap ID 或 session-local coverage_ref，不使用 selector。exclusion reason 只存在于 CSV sidecar/session，必须先导出 CSV、再导出 EL，确认成功后才关闭 session。"
