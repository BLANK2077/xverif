interface:
  display_name: "xverif"
  short_description: "按验证任务选择 xdebug、xcov、xbit、xentry、xloc、xsva 或 xwaveform"
  default_prompt: "使用 $xverif 先按问题类型选择能力，再按环境选择入口：已注入 xverif MCP 时优先 MCP；无 MCP 且必须 LSF 时使用 xdebug_lsf/xcov_lsf；无 LSF 限制时使用原生 CLI，不自动 fallback。xdebug 任务先读取 action guide，再查询选定 action schema；错误响应的 available_values 是纠错候选，catalog/schema 的 allowed_values 是完整合法值集合。对关键信号或接口生成 schema-valid JSON，通过 list.load、stream.config.load、axi.config.load 或 apb.config.load 加载后按 recommended_actions 使用 value.at，不反复调用 batch。xcov 与 x-npi 的 coverage 读取都使用 full64 URG，NPI 只做 exclusion 必要遍历和 EL 操作。xcov 先查询摘要，再导出 code/assert/functional gap；exclusion reason 必须先导出 CSV、再导出 EL，确认成功后才关闭 session。"
